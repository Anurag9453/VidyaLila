<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Drawing 70 degrees with a protractor</title>
  <desc>A horizontal ray BC and a ray BA rising from B at 70 degrees above it, with the angle ABC marked 70 degrees.</desc>
  <!-- Construction Lines and Arcs -->
  <path d="M 271.77 148.94 A 160 160 0 0 0 193.94 120.61" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="180.0" y1="280.0" x2="420.0" y2="280.0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="180.0" y1="280.0" x2="234.8" y2="129.6" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <path d="M 228.0 280.0 A 48.0 48.0 0 0 0 196.42 234.89" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="234.0" y="246.0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">70°</text>
  <!-- Point Dots -->
  <circle cx="180.0" cy="280.0" r="3" fill="currentColor" />
  <circle cx="420.0" cy="280.0" r="3" fill="currentColor" />
  <circle cx="234.72" cy="129.65" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="173.0" y="292.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="427.0" y="292.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="241.72" y="122.65" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">A</text>
</svg>