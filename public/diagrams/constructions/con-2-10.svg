  <text x="217.2" y="233.8" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">15°</text>
  <path d="M 209.29 249.73 A 80.0 80.0 0 0 0 190.0 257.72" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="192.4" y="240.6" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">15°</text>
