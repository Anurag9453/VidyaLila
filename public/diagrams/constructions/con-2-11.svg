<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Constructing 135 degrees</title>
  <desc>A straight line DC with B in the middle; a half circle of radius 4 cm from B cuts it at N and P and cuts the 90 degree ray BS at T; 4 cm arcs from T and N meet at W and ray BW makes 135 degrees with BC.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="300.0" y1="319.0" x2="300.0" y2="75.0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 459.61 330.16 A 160 160 0 1 0 140.39 330.16" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 432.22 161.43 A 160 160 0 0 0 337.43 216.15" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 229.65 125.71 A 160 160 0 0 0 229.65 235.16" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 335.42 69.03 A 120 120 0 0 0 274.23 123.75" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 325.77 123.75 A 120 120 0 0 0 264.58 69.03" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 149.65 104.28 A 160 160 0 0 0 149.65 213.72" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 194.72 168.65 A 160 160 0 0 0 85.28 168.65" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="60.0" y1="319.0" x2="540.0" y2="319.0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="300.0" y1="319.0" x2="130.4" y2="149.4" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <polygon points="300.0,319.0 312.0,319.0 312.0,307.0 300.0,307.0" stroke="currentColor" stroke-width="1.5" fill="none" />
  <path d="M 340.0 319.0 A 40.0 40.0 0 0 0 271.72 290.72" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="341.2" y="281.8" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">135°</text>
  <path d="M 300.0 239.0 A 80.0 80.0 0 0 0 243.43 262.43" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="262.4" y="232.6" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">45°</text>
  <path d="M 243.43 262.43 A 80.0 80.0 0 0 0 220.0 319.0" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="209.6" y="285.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">45°</text>
  <!-- Point Dots -->
  <circle cx="300.0" cy="319.0" r="3" fill="currentColor" />
  <circle cx="60.0" cy="319.0" r="3" fill="currentColor" />
  <circle cx="540.0" cy="319.0" r="3" fill="currentColor" />
  <circle cx="460.0" cy="319.0" r="3" fill="currentColor" />
  <circle cx="140.0" cy="319.0" r="3" fill="currentColor" />
  <circle cx="380.0" cy="180.44" r="3" fill="currentColor" />
  <circle cx="220.0" cy="180.44" r="3" fill="currentColor" />
  <circle cx="300.0" cy="90.99" r="3" fill="currentColor" />
  <circle cx="300.0" cy="159.0" r="3" fill="currentColor" />
  <circle cx="140.0" cy="159.0" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="53.0" y="331.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">D</text>
  <text x="547.0" y="331.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="300.0" y="333.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">B</text>
  <text x="460.0" y="333.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">P</text>
  <text x="140.0" y="333.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">N</text>
  <text x="390.0" y="184.44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">Q</text>
  <text x="213.0" y="173.44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">R</text>
  <text x="307.0" y="83.99" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">S</text>
  <text x="307.0" y="152.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">T</text>
  <text x="133.0" y="152.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">W</text>
</svg>