<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Constructing 60 degrees</title>
  <desc>Ray BC with a 4 cm arc from B cutting it at P, a 4 cm arc from P cutting that arc at Q, and ray BQ making a 60 degree angle with BC; triangle BPQ is equilateral.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="340.0" y1="290.0" x2="260.0" y2="151.6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 337.57 317.78 A 160 160 0 0 0 234.72 139.65" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 312.22 132.43 A 160 160 0 0 0 217.43 187.15" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="180.0" y1="290.0" x2="420.0" y2="290.0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="180.0" y1="290.0" x2="300.0" y2="82.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <line x1="260.0" y1="294.0" x2="260.0" y2="286.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="223.46" y1="222.72" x2="216.54" y2="218.72" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="303.46" y1="218.72" x2="296.54" y2="222.72" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 228.0 290.0 A 48.0 48.0 0 0 0 204.0 248.43" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="237.2" y="261.2" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">60°</text>
  <!-- Point Dots -->
  <circle cx="180.0" cy="290.0" r="3" fill="currentColor" />
  <circle cx="420.0" cy="290.0" r="3" fill="currentColor" />
  <circle cx="340.0" cy="290.0" r="3" fill="currentColor" />
  <circle cx="260.0" cy="151.44" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="173.0" y="302.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="427.0" y="302.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="340.0" y="304.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">P</text>
  <text x="253.0" y="144.44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">Q</text>
  <text x="260.0" y="308.0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">4 cm</text>
</svg>