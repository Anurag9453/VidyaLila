<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Constructing 90 degrees</title>
  <desc>Points P, Q and R on a 4 cm arc at 0, 60 and 120 degrees; 3 cm arcs from Q and R meet at S and ray BS stands at 90 degrees to ray BC.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="230.0" y1="314.0" x2="330.0" y2="140.8" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <line x1="230.0" y1="314.0" x2="130.0" y2="140.8" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 388.44 336.27 A 160 160 0 0 0 131.49 187.92" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 362.22 156.43 A 160 160 0 0 0 267.43 211.15" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 159.65 120.71 A 160 160 0 0 0 159.65 230.16" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 265.42 64.03 A 120 120 0 0 0 204.23 118.75" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 255.77 118.75 A 120 120 0 0 0 194.58 64.03" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="230.0" y1="314.0" x2="470.0" y2="314.0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="230.0" y1="314.0" x2="230.0" y2="70.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <polygon points="230.0,314.0 242.0,314.0 242.0,302.0 230.0,302.0" stroke="currentColor" stroke-width="1.5" fill="none" />
  <path d="M 270.0 314.0 A 40.0 40.0 0 0 0 230.0 274.0" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="284.4" y="298.0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">90°</text>
  <!-- Point Dots -->
  <circle cx="230.0" cy="314.0" r="3" fill="currentColor" />
  <circle cx="470.0" cy="314.0" r="3" fill="currentColor" />
  <circle cx="390.0" cy="314.0" r="3" fill="currentColor" />
  <circle cx="310.0" cy="175.44" r="3" fill="currentColor" />
  <circle cx="150.0" cy="175.44" r="3" fill="currentColor" />
  <circle cx="230.0" cy="85.99" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="223.0" y="326.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="477.0" y="326.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="390.0" y="328.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">P</text>
  <text x="317.0" y="168.44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">Q</text>
  <text x="143.0" y="168.44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">R</text>
  <text x="237.0" y="78.99" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">S</text>
</svg>