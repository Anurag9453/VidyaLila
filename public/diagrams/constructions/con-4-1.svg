<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>The failed attempt: sides 3, 4 and 8</title>
  <desc>A horizontal segment AB of 8 cm with a 3 cm arc from A and a 4 cm arc from B above it; the two arcs fall short of each other and never meet, so there is no point C.</desc>
  <!-- Construction Lines and Arcs -->
  <path d="M 260.0 269.28 A 120.0 120.0 0 0 0 200.0 165.36" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 380.0 130.72 A 160.0 160.0 0 0 0 300.0 269.28" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="140.0" y1="269.28" x2="460.0" y2="269.28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <!-- Marks -->
  <!-- Point Dots -->
  <circle cx="140.0" cy="269.28" r="3" fill="currentColor" />
  <circle cx="460.0" cy="269.28" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="133.0" y="281.28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">A</text>
  <text x="467.0" y="281.28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">B</text>
  <text x="300.0" y="287.28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">AB = 8 cm</text>
  <text x="210.0" y="155.36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="start">r = 3 cm</text>
  <text x="370.0" y="120.72" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="end">r = 4 cm</text>
  <text x="300.0" y="167.28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">3 + 4 = 7 < 8</text>
</svg>