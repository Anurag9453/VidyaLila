<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Sum of two sides, AB + AC = 8 cm</title>
  <desc>Triangle ABC with base BC of 5 cm and a 60 degree angle at B; point D on the ray from B is 8 cm away, and the perpendicular bisector of DC meets BD at A, so AB plus AC equals 8 cm.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="201.9" y1="236.4" x2="411.1" y2="206.4" stroke="#9ca3af" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round" />
  <line x1="302.7" y1="80.4" x2="342.7" y2="357.6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 336.43 236.88 A 160.0 160.0 0 0 0 444.19 155.17" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 457.29 245.94 A 160.0 160.0 0 0 0 330.82 198.04" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 188.11 192.13 A 160.0 160.0 0 0 0 314.58 240.03" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 308.97 201.19 A 160.0 160.0 0 0 0 201.21 282.9" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 387.83 151.91 A 320.0 320.0 0 0 0 198.27 42.46" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="142.7" y1="357.6" x2="342.7" y2="357.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <line x1="142.7" y1="357.6" x2="316.7" y2="56.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="213.5" y1="234.8" x2="142.7" y2="357.6" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="142.7" y1="357.6" x2="342.7" y2="357.6" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="342.7" y1="357.6" x2="213.5" y2="234.8" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <line x1="261.61" y1="159.63" x2="254.69" y2="155.63" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="275.39" y1="299.09" x2="280.91" y2="293.29" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 174.7 357.6 A 32.0 32.0 0 0 0 158.7 329.89" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="180.7" y="339.6" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">60°</text>
  <!-- Point Dots -->
  <circle cx="142.7" cy="357.6" r="3" fill="currentColor" />
  <circle cx="342.7" cy="357.6" r="3" fill="currentColor" />
  <circle cx="302.7" cy="80.47" r="3" fill="currentColor" />
  <circle cx="213.61" cy="234.78" r="3" fill="currentColor" />
  <circle cx="316.7" cy="56.22" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="135.7" y="369.6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="349.7" y="369.6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="302.7" y="70.47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">D</text>
  <text x="203.61" y="238.78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">A</text>
  <text x="316.7" y="46.22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">X</text>
  <text x="242.7" y="375.6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">BC = 5 cm</text>
  <text x="288.3" y="286.0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="start">AD = AC</text>
</svg>