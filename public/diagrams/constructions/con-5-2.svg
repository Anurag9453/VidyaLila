<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Difference of sides, AB - AC = 2 cm (AB > AC)</title>
  <desc>Triangle ABC with base BC of 6 cm and a 45 degree angle at B; D is 2 cm from B on ray BX, and A lies beyond D on the perpendicular bisector of DC, so AB minus AC equals 2 cm.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="303.6" y1="320.6" x2="385.2" y2="55.4" stroke="#9ca3af" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round" />
  <line x1="236.4" y1="212.2" x2="420.0" y2="268.6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 356.06 223.02 A 120.0 120.0 0 0 0 321.79 127.55" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 397.16 150.79 A 120.0 120.0 0 0 0 315.07 210.37" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 259.41 329.84 A 120.0 120.0 0 0 0 341.5 270.26" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 300.5 257.62 A 120.0 120.0 0 0 0 334.78 353.08" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 255.18 241.24 A 80.0 80.0 0 0 0 207.36 193.42" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="180.0" y1="268.6" x2="420.0" y2="268.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <line x1="180.0" y1="268.6" x2="401.6" y2="47.0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="381.6" y1="67.0" x2="180.0" y2="268.6" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="180.0" y1="268.6" x2="420.0" y2="268.6" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="420.0" y1="268.6" x2="381.6" y2="67.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <line x1="306.35" y1="136.59" x2="312.01" y2="142.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="396.97" y1="168.44" x2="404.83" y2="166.96" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 212.0 268.6 A 32.0 32.0 0 0 0 202.63 245.97" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="220.8" y="255.8" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">45°</text>
  <!-- Point Dots -->
  <circle cx="180.0" cy="268.6" r="3" fill="currentColor" />
  <circle cx="420.0" cy="268.6" r="3" fill="currentColor" />
  <circle cx="236.57" cy="212.03" r="3" fill="currentColor" />
  <circle cx="381.79" cy="66.81" r="3" fill="currentColor" />
  <circle cx="401.59" cy="47.01" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="173.0" y="280.6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="427.0" y="280.6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="229.57" y="224.03" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">D</text>
  <text x="388.79" y="59.81" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">A</text>
  <text x="408.59" y="40.01" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">X</text>
  <text x="300.0" y="286.6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">BC = 6 cm</text>
  <text x="410.8" y="157.8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="start">AD = AC</text>
</svg>