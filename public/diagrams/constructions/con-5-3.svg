<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Difference of sides, AC - AB = 2 cm (AB < AC)</title>
  <desc>Triangle ABC with base BC of 6 cm and a 45 degree angle at B; D lies 2 cm behind B on the opposite ray, and A is on the perpendicular bisector of DC, so AC minus AB equals 2 cm.</desc>
