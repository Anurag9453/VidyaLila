  <!-- Marks -->
  <line x1="222.73" y1="160.91" x2="228.39" y2="166.57" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="372.26" y1="139.12" x2="375.44" y2="131.78" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 249.6 171.7 A 32.0 32.0 0 0 0 240.23 149.07" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="258.4" y="158.9" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">45°</text>
  <!-- Point Dots -->
  <circle cx="217.6" cy="171.7" r="3" fill="currentColor" />
  <circle cx="457.6" cy="171.7" r="3" fill="currentColor" />
