  <path d="M 331.43 170.26 A 180.0 180.0 0 0 0 226.12 60.45" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 335.31 39.62 A 180.0 180.0 0 0 0 277.81 180.48" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 283.32 360.35 A 180.0 180.0 0 0 0 340.82 219.48" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 287.2 229.71 A 180.0 180.0 0 0 0 392.51 339.52" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 142.42 199.06 A 80.0 80.0 0 0 0 190.24 246.88" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="217.6" y1="171.7" x2="457.6" y2="171.7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <line x1="217.6" y1="171.7" x2="310.0" y2="79.3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="290.0" y1="99.3" x2="217.6" y2="171.7" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="217.6" y1="171.7" x2="457.6" y2="171.7" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
