<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Sum of two sides, AB + AC = 9 cm</title>
  <desc>Triangle ABC with base BC of 6 cm and a 60 degree angle at B; D is 9 cm from B on the ray, and the perpendicular bisector of DC meets BD at A, so AB plus AC equals 9 cm.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="188.54" y1="247.18" x2="418.44" y2="203.1" stroke="#9ca3af" stroke-width="1" stroke-dasharray="1 3" stroke-linecap="round" />
  <line x1="299.5" y1="72.38" x2="356.5" y2="368.4" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 340.92 238.13 A 171.0 171.0 0 0 0 453.22 147.13" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 471.44 241.79 A 171.0 171.0 0 0 0 333.39 198.97" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 184.56 198.83 A 171.0 171.0 0 0 0 322.61 241.65" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 315.08 202.49 A 171.0 171.0 0 0 0 202.78 293.49" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 390.49 148.57 A 342.0 342.0 0 0 0 187.89 31.6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="128.5" y1="368.4" x2="356.5" y2="368.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <line x1="128.5" y1="368.4" x2="312.8" y2="49.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="199.94" y1="244.9" x2="128.5" y2="368.4" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="128.5" y1="368.4" x2="356.5" y2="368.4" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="356.5" y1="368.4" x2="199.94" y2="244.9" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <line x1="253.09" y1="160.61" x2="246.17" y2="156.61" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="275.65" y1="309.84" x2="280.59" y2="303.56" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 158.9 368.4 A 30.4 30.4 0 0 0 143.7 342.07" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="164.6" y="351.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">60°</text>
  <!-- Point Dots -->
  <circle cx="128.5" cy="368.4" r="3" fill="currentColor" />
  <circle cx="356.5" cy="368.4" r="3" fill="currentColor" />
  <circle cx="299.5" cy="72.22" r="3" fill="currentColor" />
  <circle cx="199.75" cy="244.99" r="3" fill="currentColor" />
  <circle cx="312.8" cy="49.18" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="121.5" y="380.4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="363.5" y="380.4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="299.5" y="62.22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">D</text>
  <text x="189.75" y="248.99" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">A</text>
  <text x="312.8" y="39.18" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">X</text>
  <text x="242.5" y="386.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">BC = 6 cm</text>
  <text x="288.22" y="296.84" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="start">AD = AC</text>
</svg>