<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Difference of sides, AC - AB = 1 cm (AB < AC)</title>
  <desc>Triangle ABC with base BC of 5 cm and a 60 degree angle at B; D lies 1 cm behind B on the opposite ray, and A on the perpendicular bisector of DC gives AC minus AB equal to 1 cm.</desc>
