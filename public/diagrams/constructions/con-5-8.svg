  <path d="M 291.05 325.71 A 120.0 120.0 0 0 0 313.75 226.85" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 297.02 229.49 A 120.0 120.0 0 0 0 349.0 316.58" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 183.63 240.24 A 40.0 40.0 0 0 0 212.91 257.15" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="216.4" y1="217.3" x2="416.4" y2="217.3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <line x1="216.4" y1="217.3" x2="298.8" y2="74.1" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="284.8" y1="98.5" x2="216.4" y2="217.3" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="216.4" y1="217.3" x2="416.4" y2="217.3" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="416.4" y1="217.3" x2="284.8" y2="98.5" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <line x1="237.23" y1="173.24" x2="244.15" y2="177.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="348.01" y1="160.89" x2="353.37" y2="154.95" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 248.4 217.3 A 32.0 32.0 0 0 0 232.4 189.59" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <text x="254.4" y="199.3" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">60°</text>
  <!-- Point Dots -->
  <circle cx="216.4" cy="217.3" r="3" fill="currentColor" />
  <circle cx="416.4" cy="217.3" r="3" fill="currentColor" />
