<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>General quadrilateral from 4 sides and a diagonal</title>
  <desc>Quadrilateral ABCD built on a 6 cm diagonal AC, with B above AC and D below it, and the other diagonal BD shown dashed.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="270.0" y1="81.0" x2="273.2" y2="317.8" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 317.47 131.54 A 160.0 160.0 0 0 0 205.66 55.47" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 339.96 30.11 A 200.0 200.0 0 0 0 228.15 156.9" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 220.49 347.42 A 140.0 140.0 0 0 0 308.69 268.53" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 242.97 245.99 A 180.0 180.0 0 0 0 331.18 369.96" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="180.0" y1="213.4" x2="420.0" y2="213.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="180.0" y1="213.4" x2="270.0" y2="81.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="270.0" y1="81.0" x2="420.0" y2="213.4" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="420.0" y1="213.4" x2="273.2" y2="317.8" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="273.2" y1="317.8" x2="180.0" y2="213.4" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <!-- Point Dots -->
  <circle cx="180.0" cy="213.4" r="3" fill="currentColor" />
  <circle cx="420.0" cy="213.4" r="3" fill="currentColor" />
  <circle cx="270.0" cy="81.11" r="3" fill="currentColor" />
  <circle cx="273.33" cy="317.75" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="170.0" y="217.4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">A</text>
  <text x="430.0" y="217.4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="270.0" y="71.11" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">B</text>
  <text x="273.33" y="331.75" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">D</text>
  <text x="300.0" y="231.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">AC = 6 cm</text>
  <text x="214.8" y="137.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="end">4 cm</text>
  <text x="354.8" y="137.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="start">5 cm</text>
  <text x="356.8" y="281.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="start">4.5 cm</text>
  <text x="216.8" y="281.4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="end">3.5 cm</text>
</svg>