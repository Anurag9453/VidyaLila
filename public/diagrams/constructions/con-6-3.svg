  <path d="M 355.97 53.37 A 160.0 160.0 0 0 0 266.52 154.8" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 244.03 346.63 A 160.0 160.0 0 0 0 333.48 245.2" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
