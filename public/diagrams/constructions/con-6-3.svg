  <line x1="300.0" y1="94.0" x2="420.0" y2="200.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="420.0" y1="200.0" x2="300.0" y2="306.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="300.0" y1="306.0" x2="180.0" y2="200.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <polygon points="300.0,200.0 312.0,200.0 312.0,188.0 300.0,188.0" stroke="currentColor" stroke-width="1.5" fill="none" />
  <line x1="242.65" y1="150.08" x2="237.35" y2="144.08" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="357.35" y1="150.08" x2="362.65" y2="144.08" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="357.35" y1="249.92" x2="362.65" y2="255.92" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="242.65" y1="249.92" x2="237.35" y2="255.92" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- Point Dots -->
  <circle cx="180.0" cy="200.0" r="3" fill="currentColor" />
  <circle cx="420.0" cy="200.0" r="3" fill="currentColor" />
  <circle cx="300.0" cy="94.17" r="3" fill="currentColor" />
  <circle cx="300.0" cy="305.83" r="3" fill="currentColor" />
  <circle cx="300.0" cy="200.0" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="170.0" y="204.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">A</text>
  <text x="430.0" y="204.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">C</text>
  <text x="300.0" y="84.17" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">B</text>
  <text x="300.0" y="319.83" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">D</text>
  <text x="307.0" y="193.0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">O</text>
  <text x="300.0" y="218.0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">AC = 6 cm</text>
