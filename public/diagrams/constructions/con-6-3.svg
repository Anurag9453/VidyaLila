<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Rhombus from a side and a diagonal</title>
  <desc>Rhombus ABCD with every side 4 cm and horizontal diagonal AC of 6 cm, with the vertical diagonal BD dashed and meeting AC at O at a right angle.</desc>
  <!-- Construction Lines and Arcs -->
