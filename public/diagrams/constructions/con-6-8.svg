<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" role="img" style="color: #0f172a; max-width: 100%; display: block;">
  <title>Kite from sides and one diagonal</title>
  <desc>Kite ABCD with the 4 cm diagonal BD horizontal, A 3 cm from B and D above it and C 5 cm from B and D below it, and the dashed diagonal AC perpendicular to BD.</desc>
  <!-- Construction Lines and Arcs -->
  <line x1="300.0" y1="67.9" x2="300.0" y2="340.7" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 330.3 110.25 A 120.0 120.0 0 0 0 254.7 42.63" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 345.3 42.63 A 120.0 120.0 0 0 0 269.7 110.25" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 215.04 357.44 A 200.0 200.0 0 0 0 369.97 289.82" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <path d="M 230.03 289.82 A 200.0 200.0 0 0 0 384.96 357.44" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round" fill="none" />
  <!-- Given Objects -->
  <line x1="220.0" y1="157.5" x2="380.0" y2="157.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
  <!-- Result Objects -->
  <line x1="300.0" y1="67.9" x2="220.0" y2="157.5" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="220.0" y1="157.5" x2="300.0" y2="340.7" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="300.0" y1="340.7" x2="380.0" y2="157.5" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <line x1="380.0" y1="157.5" x2="300.0" y2="67.9" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
  <!-- Marks -->
  <polygon points="300.0,157.5 312.0,157.5 312.0,145.5 300.0,145.5" stroke="currentColor" stroke-width="1.5" fill="none" />
  <line x1="257.02" y1="110.11" x2="262.98" y2="115.45" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="337.02" y1="115.45" x2="342.98" y2="110.11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="264.47" y1="249.38" x2="257.13" y2="252.58" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="262.87" y1="245.72" x2="255.53" y2="248.92" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="342.87" y1="252.58" x2="335.53" y2="249.38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <line x1="344.47" y1="248.92" x2="337.13" y2="245.72" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- Point Dots -->
  <circle cx="220.0" cy="157.5" r="3" fill="currentColor" />
  <circle cx="380.0" cy="157.5" r="3" fill="currentColor" />
  <circle cx="300.0" cy="68.06" r="3" fill="currentColor" />
  <circle cx="300.0" cy="340.8" r="3" fill="currentColor" />
  <!-- Labels -->
  <text x="210.0" y="161.5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="end">B</text>
  <text x="390.0" y="161.5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="start">D</text>
  <text x="300.0" y="58.06" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">A</text>
  <text x="300.0" y="354.8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">C</text>
  <text x="260.0" y="143.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="normal" fill="currentColor" text-anchor="middle">BD = 4 cm</text>
